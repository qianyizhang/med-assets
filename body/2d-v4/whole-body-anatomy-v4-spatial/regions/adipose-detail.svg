    <linearGradient id="body-wash" x1="175" y1="260" x2="390" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#F6F5EF"/><stop offset=".52" stop-color="#E9EEEA"/><stop offset="1" stop-color="#F6F5EF"/></linearGradient>

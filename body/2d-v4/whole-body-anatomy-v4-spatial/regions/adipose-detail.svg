<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="307 665 41 73" fill="none" role="group" aria-labelledby="body-title body-description" data-artwork-version="4.0-spatial" data-language="en" data-region="adipose-detail" width="41" height="73" data-body-origin-box="311 670 31 65" data-body-origin-space="atlas.svg" data-source-view="adipose-detail" data-source-file="atlas.svg">
  <title id="body-title">Whole-body systems explorer with enlarged anatomy details</title>
  <desc id="body-description">Original educational vector schematic. The main figure is a transparent front-view atlas: the person’s right is on the viewer’s left. Independent head and neck, reproductive, pregnancy, and blood-cell insets are separately labelled and are not all parts of one simultaneous anatomy. Organs, cell sizes, depth and routes are simplified; cutaways represent tissues distributed through the body. The main pelvic symbol is a locator only. Not for diagnosis, procedures or anatomical measurement.</desc>

  <title id="body-title">Head and neck: anatomically informed sagittal, lateral and posterior teaching views</title>
  <desc id="body-description">Original anatomical illustration. Adult head near-midline section facing right with the nasal septum removed to reveal the lateral nasal wall; separate lateral head and posterior thyroid views. Off-midline structures are not placed in the midline section. Different scales; small glands enlarged. Anatomical variation is simplified. Not for diagnosis or procedures.</desc>

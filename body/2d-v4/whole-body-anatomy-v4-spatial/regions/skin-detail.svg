    <linearGradient id="heart-wash" x1="267" y1="285" x2="315" y2="356" gradientUnits="userSpaceOnUse"><stop stop-color="#BD6B59"/><stop offset=".6" stop-color="#A44F43"/><stop offset="1" stop-color="#873F3B"/></linearGradient>
    <linearGradient id="liver-wash" x1="211" y1="377" x2="297" y2="426" gradientUnits="userSpaceOnUse"><stop stop-color="#AB6A52"/><stop offset="1" stop-color="#7B4C43"/></linearGradient>

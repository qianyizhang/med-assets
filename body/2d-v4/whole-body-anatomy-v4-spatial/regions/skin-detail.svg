    <linearGradient id="kidney-wash" x1="222" y1="431" x2="337" y2="488" gradientUnits="userSpaceOnUse"><stop stop-color="#AB7B80"/><stop offset="1" stop-color="#825F71"/></linearGradient>
    <linearGradient id="intestine-wash" x1="236" y1="484" x2="326" y2="560" gradientUnits="userSpaceOnUse"><stop stop-color="#DDB59B"/><stop offset="1" stop-color="#C99077"/></linearGradient>
    <linearGradient id="bone-wash" x1="400" y1="292" x2="409" y2="405" gradientUnits="userSpaceOnUse"><stop stop-color="#FFFDF0"/><stop offset=".55" stop-color="#DCD7BF"/><stop offset="1" stop-color="#F7F1DA"/></linearGradient>
    <linearGradient id="muscle-wash" x1="149" y1="311" x2="125" y2="412" gradientUnits="userSpaceOnUse"><stop stop-color="#C68A75"/><stop offset=".55" stop-color="#A96B5E"/><stop offset="1" stop-color="#DBAC91"/></linearGradient>
    <radialGradient id="endocrine-wash"><stop stop-color="#E8CD89"/><stop offset="1" stop-color="#C8A45E"/></radialGradient>
    <filter id="selected-glow" x="-35%" y="-35%" width="170%" height="170%"><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#397F70" flood-opacity=".4"/></filter>
    <style>
      .organ{cursor:pointer;transition:opacity .24s ease,filter .24s ease;outline:none}
      .organ.is-dimmed,.organ.dimmed{opacity:.14}
      .organ.is-active,.organ.active,.organ:focus-visible{filter:url(#selected-glow)}
      .organ:hover{filter:url(#selected-glow)}
      .organ .detail{pointer-events:none}
      .organ-hit{fill:transparent;stroke:none}
      @media(prefers-reduced-motion:reduce){.organ{transition:none}}
    
      .panel-title{font-family:Arial,"Noto Sans CJK SC",sans-serif;font-size:13px;font-weight:700;letter-spacing:.35px;fill:#42584f}
      .panel-note{font-family:Arial,"Noto Sans CJK SC",sans-serif;font-size:10px;fill:#7b887d}
      .inset-label{font-family:Arial,"Noto Sans CJK SC",sans-serif;font-size:10px;fill:#66776c}
      .inset-rule{stroke:#b9c8bb;stroke-width:1;fill:none}

</style>

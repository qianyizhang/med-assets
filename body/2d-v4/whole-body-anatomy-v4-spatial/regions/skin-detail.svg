<?xml version='1.0' encoding='UTF-8'?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="92 432 50 60" fill="none" role="group" aria-labelledby="body-title body-description" data-artwork-version="4.0-spatial" data-language="en" data-region="skin-detail" width="50" height="60" data-body-origin-box="98 437 37 49" data-body-origin-space="atlas.svg" data-source-view="skin-detail" data-source-file="atlas.svg">
  <title id="body-title">Whole-body systems explorer with enlarged anatomy details</title>
  <desc id="body-description">Original educational vector schematic. The main figure is a transparent front-view atlas: the person’s right is on the viewer’s left. Independent head and neck, reproductive, pregnancy, and blood-cell insets are separately labelled and are not all parts of one simultaneous anatomy. Organs, cell sizes, depth and routes are simplified; cutaways represent tissues distributed through the body. The main pelvic symbol is a locator only. Not for diagnosis, procedures or anatomical measurement.</desc>
  <defs>
    <linearGradient id="body-wash" x1="175" y1="260" x2="390" y2="850" gradientUnits="userSpaceOnUse"><stop stop-color="#F6F5EF"/><stop offset=".52" stop-color="#E9EEEA"/><stop offset="1" stop-color="#F6F5EF"/></linearGradient>
    <linearGradient id="brain-wash" x1="245" y1="55" x2="313" y2="112" gradientUnits="userSpaceOnUse"><stop stop-color="#EBC5B5"/><stop offset="1" stop-color="#CF8F7E"/></linearGradient>

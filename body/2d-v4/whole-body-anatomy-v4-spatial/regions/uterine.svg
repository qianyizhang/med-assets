    <style>
      .organ{cursor:pointer;transition:opacity .24s ease,filter .24s ease;outline:none}
      .organ.is-dimmed,.organ.dimmed{opacity:.14}
      .organ.is-active,.organ.active,.organ:focus-visible{filter:url(#selected-glow)}
      .organ:hover{filter:url(#selected-glow)}
      .organ .detail{pointer-events:none}
      .organ-hit{fill:transparent;stroke:none}
      @media(prefers-reduced-motion:reduce){.organ{transition:none}}
    

<title id="depth-title">Kidneys in depth: transverse section through the upper abdomen</title>
<desc id="depth-description">A simplified cross-section viewed from the feet. Front is at the top, back at the bottom, and the patient's right is on the left of the image. Both kidneys sit at the back, outside the peritoneal compartment, on either side of the spine. The schematic projects representative digestive structures to explain depth, not an exact scan slice.</desc>

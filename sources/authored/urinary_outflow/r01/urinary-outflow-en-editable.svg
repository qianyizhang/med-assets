<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1060" viewBox="0 0 1400 1060" role="img" aria-labelledby="title desc"><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#76b9f4"/></marker><style>text{font-family:'Noto Sans CJK SC','Noto Sans',sans-serif;fill:#e9edf1}.label{font-size:20px}.small{font-size:16px;fill:#adb7c3}.section{font-size:16px;letter-spacing:1.3px;fill:#adb7c3}.lead{fill:none;stroke:#6f7d8b;stroke-width:1.5}.flow{fill:none;stroke:#76b9f4;stroke-width:3;marker-end:url(#arrow)}.outline{fill:#28323c;stroke:#a8b4c0;stroke-width:3}</style></defs><rect width="1400" height="1060" fill="#101318"/><rect x="32" y="32" width="1336" height="996" rx="18" fill="#151a20" stroke="#323b46"/><title id="title">Urinary outflow: same destination, different route</title><desc id="desc">Typical female and male anatomy · lower-tract relationship schematic, not a measured section. Not to scale. Simplified contours; sphincters, reproductive ducts and other pelvic structures omitted.</desc><text x="70" y="90" class="title" font-size="28" font-weight="600">Urinary outflow: same destination, different route</text><text x="70" y="126" class="small" >Typical female and male anatomy · lower-tract relationship schematic, not a measured section</text><rect x="70" y="156" width="1260" height="89" rx="10" fill="#1c232b" stroke="#323b46"/><text x="92" y="190" class="label" >Kidneys → ureters → bladder → urethra → outside</text><text x="92" y="222" class="small" >Ureters bring urine TO the bladder. The urethra carries it OUT.</text><rect x="70" y="270" width="610" height="619" rx="12" fill="#171e25" stroke="#323b46"/><rect x="720" y="270" width="610" height="619" rx="12" fill="#171e25" stroke="#323b46"/><text x="95" y="307" class="section" >FEMALE LOWER TRACT</text><text x="745" y="307" class="section" >MALE LOWER TRACT</text><text x="100" y="341" class="small" >ANTERIOR</text><text x="490" y="341" class="small" >POSTERIOR</text><text x="750" y="341" class="small" >ANTERIOR</text><text x="1135" y="341" class="small" >POSTERIOR</text><path class="outline" d="M350 368 C290 366 252 406 258 449 C261 492 304 521 343 524 C382 521 428 490 439 449 C451 407 410 368 350 368Z"/><path d="M343 522 Q345 580 330 648" fill="none" stroke="#a8b4c0" stroke-width="18" stroke-linecap="round"/><path class="flow" d="M343 533Q343 578 337 609"/><path class="flow" d="M332 631L327 662"/><path d="M476 434 Q490 500 470 578 L460 651 L497 656 L509 583 Q529 493 512 429" fill="#252b32" stroke="#7e8893" stroke-width="2"/><path d="M476 434L512 429" fill="none" stroke="#7e8893" stroke-width="2" stroke-dasharray="5 5"/><path d="M465 652L492 655" stroke="#171e25" stroke-width="7"/><text x="95" y="412" class="label" >Bladder</text><path class="lead" d="M229 406H251L264 416"/><text x="95" y="562" class="label" >Urethra</text><path class="lead" d="M229 556H288L340 573"/><text x="491" y="388" class="label" >Vagina</text><path class="lead" d="M520 397L505 436"/><text x="430" y="701" class="label" >Vaginal opening</text><path class="lead" d="M477 678L479 654"/><text x="429" y="731" class="small" >Separate canal · not urinary</text><text x="100" y="701" class="label" >Urethral opening</text><path class="lead" d="M247 695L278 681L329 648"/><path class="outline" d="M1000 368 C940 366 902 406 908 449 C911 492 954 521 993 524 C1032 521 1078 490 1089 449 C1101 407 1060 368 1000 368Z"/><path d="M967 526 C935 538 938 576 961 592 C977 605 1009 605 1026 590 C1051 570 1047 538 1022 526Z" fill="#46515d" stroke="#a8b4c0" stroke-width="2.5"/><path d="M989 618 C969 648 920 647 881 653 L808 665 C786 670 779 693 784 710 C790 729 812 735 833 723 L900 699 C952 683 1003 684 1023 647Z" fill="#28323c" stroke="#7e8994" stroke-width="2"/><path d="M993 522 L993 610 C990 652 947 663 892 675 L787 700" fill="none" stroke="#a8b4c0" stroke-width="14" stroke-linecap="round"/><path d="M782 691L782 710" stroke="#171e25" stroke-width="7"/><path class="flow" d="M993 527V576"/><path class="flow" d="M993 598Q993 630 976 644"/><path class="flow" d="M942 661L877 679"/><path class="flow" d="M850 688L770 704"/><text x="1141" y="405" class="label" >Bladder</text><path class="lead" d="M1128 399H1106L1087 417"/><text x="1107" y="530" class="label" >Prostate</text><text x="1107" y="558" class="small" >Below the bladder</text><path class="lead" d="M1090 524H1069L1040 552"/><text x="1107" y="610" class="label" >Prostatic urethra</text><path class="lead" d="M1090 604H1060L994 565"/><text x="1107" y="664" class="label" >Membranous urethra</text><path class="lead" d="M1090 658H1060L993 614"/><text x="1026" y="751" class="label" >Spongy (penile) urethra</text><text x="1026" y="780" class="small" >Within corpus spongiosum</text><path class="lead" d="M1013 745H982L899 675"/><text x="750" y="780" class="label" >External urethral opening</text><path class="lead" d="M792 757L787 700"/><text x="95" y="824" class="small" >Urethra lies anterior to the vagina; the openings are separate.</text><text x="745" y="824" class="small" >Urethra passes through the prostate, then continues through the penis.</text><text x="95" y="856" class="small" >Blue arrows: urine outflow</text><text x="745" y="856" class="small" >Short bladder-wall segment not separately labeled.</text><path d="M70 918H1330" stroke="#323b46"/><text x="70" y="951" class="small" >Not to scale. Simplified contours; sphincters, reproductive ducts and other pelvic structures omitted.</text><text x="70" y="986" class="small" >References: NIDDK · OpenStax Anatomy &amp; Physiology §25.2. Original diagram; no source figure copied.</text><text x="70" y="1015" class="small" >Static relationship aid · not 3D validation</text></svg>
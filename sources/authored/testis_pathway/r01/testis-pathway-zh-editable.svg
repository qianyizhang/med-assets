" class="label" >卷曲的生精小管</text><text x="78" y="522" class="small" >卷曲仅作示意</text><path class="lead" d="M313 500H367L464 503"/><text x="78" y="688" class="label" >生精直小管</text><text x="78" y="718" class="small" >(tubuli recti)</text><path class="lead" d="M332 682H365L637 612"/><text x="78" y="580" class="label" >睾丸网 Rete testis</text><text x="78" y="608" class="small" >位于后部睾丸纵隔内</text><path class="lead" d="M302 574H360L703 560"/><text x="987" y="266" class="section" >睾丸外部</text><text x="987" y="292" class="small" >外形轮廓；省略内部管道卷曲</text><text x="987" y="336" class="label" >附睾头 Head</text><path class="lead" d="M970 330H920L804 324"/><text x="987" y="420" class="label" >睾丸输出小管</text><path class="lead" d="M970 414H928L755 385"/><text x="987" y="504" class="label" >附睾体 Body</text><path class="lead" d="M970 498H930L803 511"/><text x="987" y="606" class="label" >输精管 Ductus deferens</text><text x="987" y="637" class="small" >由附睾尾延续并向上走行</text><path class="lead" d="M970 600H930L862 600"/><text x="987" y="745" class="label" >附睾尾 Tail</text><path class="lead" d="M970 739H922L815 757"/><text x="987" y="805" class="small" >蓝色箭头：精子输送方向</text><rect x="70" y="863" width="1260" height="100" rx="10" fill="#1c232b" stroke="#323b46"/><text x="88" y="889" class="section" >输送路径</text><text x="92" y="929" class="small" >生精小管</text><text x="315" y="929" class="label" font-size="20" fill="#76b9f4">→</text><text x="340" y="929" class="small" >生精直小管 → 睾丸网</text><text x="563" y="929" class="label" font-size="20" fill="#76b9f4">→</text><text x="588" y="929" class="small" >睾丸输出小管</text><text x="811" y="929" class="label" font-size="20" fill="#76b9f4">→</text><text x="836" y="929" class="small" >附睾头 → 体 → 尾</text><text x="1059" y="929" class="label" font-size="20" fill="#76b9f4">→</text><text x="1084" y="929" class="small" >输精管</text><text x="70" y="991" class="small" >非等比例。卷曲、小叶和管道数量均为示意；不表达管腔直径或临床几何精度。</text><text x="70" y="1018" class="small" font-size="14">参考：NCI SEER · OpenStax Anatomy &amp; Phys
<text x="600" y="453" class="small" text-anchor="middle">On the inner side of the dental arches</text>
<text x="600" y="579" class="label" text-anchor="middle">Tongue</text>
<text x="960" y="592" class="label" text-anchor="start">Floor of mouth</text>
<text x="960" y="618" class="small" text-anchor="start">Mucosa under /</text>
<text x="960" y="643" class="small" text-anchor="start">beside the tongue</text>
<path d="M 950 657 L 851 657 L 733 628" fill="none" stroke="#566d70" stroke-width="2" stroke-linejoin="round"/>
<text x="600" y="715" class="fine" text-anchor="middle">INFERIOR</text>
<text x="600" y="157" class="fine" text-anchor="middle">SUPERIOR</text>
<rect x="58" y="748" width="1084" height="92" rx="12" fill="#edf3ed" stroke="#d4dfd5"/>
<text x="80" y="783" class="label" text-anchor="start">The cheek does not attach straight to the hard palate.</text>
<text x="80" y="815" class="small" text-anchor="start">Beige: schematic tooth-bearing support / palate; pink: mucosal and soft-tissue cues, not layers.</text>
<text x="64" y="878" class="small" text-anchor="start">Connected regions, not sealed compartments. Lips bound the vestibule at the front.</text>
<text x="64" y="908" class="small" text-anchor="start">Posteriorly, the oral cavity continues toward the fauces; that opening is not shown.</text>
<text x="64" y="945" class="fine" text-anchor="start">Schematic: mucosal folds simplified; roots, glands and muscles omitted. Colors are teaching cues, not histology.</text>
<text x="64" y="973" class="fine" text-anchor="start">Reference: OpenStax Anatomy and Physiology 23.3 · original diagram, no copied source image.</text>

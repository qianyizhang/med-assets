<text x="600" y="191" class="label" text-anchor="middle">Hard palate</text>
<text x="600" y="216" class="small" text-anchor="middle">Roof of the oral cavity</text>
<path d="M 600 224 L 600 252" fill="none" stroke="#566d70" stroke-width="2" stroke-linejoin="round"/>

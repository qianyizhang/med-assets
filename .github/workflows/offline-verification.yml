name: Offline repository verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Offline tests and metadata integrity (no media-byte claim)
        run: python3 tools/verify.py offline
      - name: Build real-repository asset governance catalog
        run: |
          python3 tools/asset_governance.py scan > "$RUNNER_TEMP/asset-governance-catalog.json"
          python3 - "$RUNNER_TEMP/asset-governance-catalog.json" <<'PY'
          import json, sys
          catalog = json.load(open(sys.argv[1]))
          counts = catalog["counts"]
          domains = {}
          for row in catalog["consumers"]:
              domains[row["domain"]] = domains.get(row["domain"], 0) + 1
          assert counts["packageCandidates"] > 0, counts
          assert domains.get("body-systems") == 11, domains
          assert counts["ultrasoundCases"] == 32, counts
          assert counts["ultrasoundCaseViews"] == 163, counts
          assert counts["ultrasoundSweeps"] == 16, counts
          assert counts["teachingAssessments"] == 130, counts
          assert domains.get("ultrasound-anatomy", 0) >= 211, domains
          print(json.dumps({"counts": counts, "consumerDomains": domains}, indent=2))
          PY

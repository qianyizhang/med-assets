name: Offline repository verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          lfs: false
          submodules: false
          fetch-depth: 0
      - name: Classify change and check documentation whitespace
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scope=full
          if git show "$BASE_SHA:tools/docs_scope.py" > "$RUNNER_TEMP/docs_scope.py"; then
            scope=$(python3 "$RUNNER_TEMP/docs_scope.py" "$BASE_SHA" HEAD)
          fi
          echo "scope=$scope" >> "$GITHUB_OUTPUT"
          if [ "$scope" = docs ]; then
            git diff --check "$BASE_SHA...HEAD"
          fi
      - name: Classifier tests
        if: steps.scope.outputs.scope != 'docs'
        run: python3 -m unittest discover -s tests -p test_docs_scope.py
      - name: Required stdlib tests and metadata integrity (no media-byte claim)
        if: steps.scope.outputs.scope != 'docs'
        run: python3 tools/verify.py offline

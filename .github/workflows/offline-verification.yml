name: Offline repository verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.11.8'
      - name: Install locked Python environment
        run: uv sync --locked
      - name: Offline tests and metadata integrity (no media-byte claim)
        run: uv run --offline --no-sync python tools/verify.py offline
      - name: AssetKit contracts including Liver and Cardiac Atlas
        run: uv run --offline --no-sync pytest src/assetkit/tests

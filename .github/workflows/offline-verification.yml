name: Offline repository verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          persist-credentials: false
          lfs: false
          submodules: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.21.0'
      - name: Offline tests and metadata integrity (no media-byte claim)
        run: python3 tools/verify.py offline
      - name: Build real-repository asset governance catalog
        run: |
          python3 tools/asset_governance.py scan > "$RUNNER_TEMP/asset-governance-catalog.json"
          python3 - "$RUNNER_TEMP/asset-governance-catalog.json" <<'PY'
          import json, sys
          from pathlib import Path
          catalog = json.load(open(sys.argv[1]))
          counts = catalog["counts"]
          domains = {}
          for row in catalog["consumers"]:
              domains[row["domain"]] = domains.get(row["domain"], 0) + 1
          assert counts["packageCandidates"] > 0, counts
          assert counts["partCandidates"] > 0, counts
          assert counts["bodySystemStops"] == 11, counts
          assert counts["bodySystemAssemblies"] == 11, counts
          assert counts["bodySystemPlates"] >= 30, counts
          assert counts["ultrasoundCases"] == 32, counts
          assert counts["ultrasoundCaseViews"] == 163, counts
          assert counts["ultrasoundTours"] == 32, counts
          assert counts["ultrasoundTourChapters"] == 410, counts
          assert counts["ultrasoundSweeps"] == 16, counts
          assert counts["ultrasoundReferences"] >= 100, counts
          assert counts["ultrasoundReferenceRequirements"] >= 1, counts
          assert counts["structuredLessons"] == 1, counts
          assert counts["teachingAssessments"] == 130, counts
          assert counts["provisionalRecords"] >= 1, counts
          assert domains.get("ultrasound-anatomy", 0) >= 211, domains
          cardiac = json.loads(Path("heart/Cardiac_Atlas_Animated/asset.record.json").read_text())
          assert cardiac["assetId"] == "anatomy:heart:cardiac-atlas", cardiac
          assert cardiac["status"] == "provisional", cardiac
          assert len(cardiac["parts"]) == 5, cardiac
          assert len(cardiac["revisions"]) == 1, cardiac
          assert cardiac["revisions"][0]["revisionId"] == "shared-source-r01", cardiac
          assert len(cardiac["revisions"][0]["exports"]) == 2, cardiac
          assert len(cardiac["uses"]) == 2 and all(use["status"] == "provisional" for use in cardiac["uses"]), cardiac
          print(json.dumps({"counts": counts, "consumerDomains": domains,
                            "cardiacPilot": {"assetId": cardiac["assetId"], "status": cardiac["status"],
                              "parts": len(cardiac["parts"]), "revision": cardiac["revisions"][0]["revisionId"],
                              "exports": len(cardiac["revisions"][0]["exports"]), "provisionalUses": len(cardiac["uses"])}}, indent=2))
          PY

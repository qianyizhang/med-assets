name: FDI31 staged-source verification (no LFS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          lfs: false
          submodules: false
          sparse-checkout: |
            lib/med_assets/__init__.py
            lib/med_assets/glb.py
            tests/source_checks
            transport/manifests/ab97d341e9490f418a06d4d9943c0ab2743f22713c174446d8d3f3c0b7ee1118.json
            transport/tools/lfs_transport.py
          sparse-checkout-cone-mode: false
      - name: Fetch exact 5 staged objects and verify sizes, hashes and headers
        run: python3 tests/source_checks/verify_fdi31_source.py --output "$RUNNER_TEMP/fdi31-verified-review"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "med-assets"
version = "0.1.0"
description = "Medical teaching assets toolkit and asset management libraries."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.29.3",
]

[project.scripts]
assetkit = "assetkit.cli:main"

[dependency-groups]
dev = [
  "pre-commit>=4.0",
  "ruff>=0.9",
  "ty>=0.0.112",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools]
packages = ["med_assets", "assetkit"]

[tool.setuptools.package-dir]
med_assets = "lib/med_assets"
assetkit = "src/assetkit"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".artifacts", "node_modules", "sites"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ty.environment]
python-version = "3.12"
root = ["./src", "./lib"]
